      <stop offset="0%" stop-color="#0a1628" />
      <stop offset="50%" stop-color="#142c54" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tcs-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tcs-grad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
